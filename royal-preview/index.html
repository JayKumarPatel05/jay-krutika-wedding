:root{--wine:#16254d;--gold:#c39142;--paper:#fff2df;--ink:#442b3b}
#cover{display:grid;place-items:center;background:#111b3b;color:#ffe0a0;transition:opacity .55s 2.05s,visibility 0s 2.6s}
.palace-sky{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 75%,#934c49,transparent 65%),repeating-linear-gradient(45deg,#e7b86712 0 1px,transparent 1px 15px),linear-gradient(135deg,#101a38,#263762 50%,#150e2a)}
.palace-portal{width:min(84vw,440px,59svh);height:min(77svh,610px);position:relative;isolation:isolate;perspective:850px;border:4px double #eabd70;border-radius:50% 50% 8px 8px / 29% 29% 8px 8px;overflow:hidden;box-shadow:0 0 0 9px #c9954b30,0 20px 70px #090a17}
.palace-light{position:absolute;inset:0;background:radial-gradient(ellipse at center,#fff7d5,#e6a96e 35%,#a15348 65%,#292447);transform:scale(.9)}
.palace-gate{position:absolute;top:0;bottom:0;width:50%;background:repeating-linear-gradient(45deg,#d9a95c55 0 1px,transparent 1px 20px),repeating-linear-gradient(-45deg,#d9a95c55 0 1px,transparent 1px 20px),linear-gradient(135deg,#34497e,#141f43 65%);border:2px solid #b3834a;transition:transform 1.8s .12s cubic-bezier(.4,.05,.2,1);box-shadow:inset 0 0 0 8px #172146,inset 0 0 0 10px #c7965a}
.gate-left{left:0;transform-origin:left center}.gate-right{right:0;transform-origin:right center}
.opening .gate-left{transform:rotateY(-108deg)}.opening .gate-right{transform:rotateY(108deg)}
.opening .palace-light{animation:palace-bloom 2.3s ease-out both}
@keyframes palace-bloom{0%{transform:scale(.9);filter:brightness(.8)}65%,100%{transform:scale(1.25);filter:brightness(1.55)}}
.palace-label,.palace-names,.palace-prompt{position:absolute;inset-inline:10px;text-align:center;transition:opacity .35s;pointer-events:none;text-shadow:0 2px 10px #100f24}
.palace-label{top:22%;font-size:14px;letter-spacing:.17em}.palace-names{top:61%;font-size:clamp(25px,7vw,48px);line-height:1.3}.palace-prompt{bottom:5%;font-size:15px;margin:0}
#cover .palace-seal{top:47%;background:radial-gradient(circle at 38% 28%,#fff0bf,#a96926);color:#352038;border-color:#ffdda1}
.opening .palace-label,.opening .palace-names,.opening .palace-prompt{opacity:0}
body{background:radial-gradient(ellipse at top,#f8cbad,#fff2df 60%)}
.sacred-page{background:radial-gradient(ellipse at 50% 5%,#fff7e6,#f7d4bf 65%,#e2a6a5)}
.invitation-card{background:#fff6e7;border-color:#be8743;outline-color:#c0925fa0;box-shadow:0 16px 50px #662e3a24}
.schedule{background:#f6dacb}.family-section{background:#fff2df}
.countdown-section{background:linear-gradient(155deg,#1a274f,#2c3960 50%,#532c50);color:#fff2da}
.countdown-section .eyebrow{color:#ffe0a6}
.countdown>div{width:clamp(57px,15vw,116px);padding:12px 3px 10px;border:3px double #f4c874;border-radius:48% 48% 5px 5px / 36% 36% 5px 5px;background:linear-gradient(150deg,#933e66,#542648)}
.countdown>div:nth-child(2n){background:linear-gradient(150deg,#9d572c,#623445)}
.countdown small{letter-spacing:0}
@media(prefers-reduced-motion:reduce){.palace-gate,.palace-label,.palace-names,.palace-prompt{transition:none}.opening .palace-light{animation:none}}

/* Ahmedabad meets Kolkata: bandhani dots, stepped geometry and alpana petals. */
:root{--wine:#702234;--gold:#bd8743;--paper:#fff5e5;--ink:#472b31}
#cover{background:#4c1b30}
.palace-sky{background:radial-gradient(ellipse at 50% 80%,#bc7258,transparent 65%),linear-gradient(112deg,#432244 0%,#74304a 48%,#6d2331 52%,#360e20 100%)}
.cross-city-band{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;pointer-events:none;opacity:.27}
.cross-city-band span:first-child{background:radial-gradient(circle,#fbd29a 0 1.5px,transparent 2.5px) 0 0/21px 21px,radial-gradient(circle,#fbd29a 0 1px,transparent 2px) 10px 10px/21px 21px}
.cross-city-band span:last-child{background:repeating-radial-gradient(ellipse at 100% 64%,transparent 0 26px,#ffe7c7 27px 28px,transparent 30px 42px)}
.palace-portal{border-radius:42% 42% 6px 6px / 24% 24% 6px 6px}
.gate-left{background:radial-gradient(circle,#dfae72 0 1px,transparent 2px) 0 0/13px 13px,linear-gradient(135deg,#793b6b,#412447)}
.gate-left::after{content:"";position:absolute;inset:14% 12%;background:#ebbe7d;clip-path:polygon(0 0,85% 0,85% 12%,72% 12%,72% 24%,59% 24%,59% 36%,46% 36%,46% 38%,61% 38%,61% 26%,74% 26%,74% 14%,87% 14%,87% 0,100% 0,100% 100%,0 100%,0 98%,98% 98%,98% 2%,0 2%);opacity:.8}
.gate-right{background:linear-gradient(135deg,#a84953,#591c30)}
.gate-right::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 18% 8% at 78% 27%,transparent 84%,#ffe2b0 90% 96%,transparent),radial-gradient(ellipse 8% 18% at 78% 27%,transparent 84%,#ffe2b0 90% 96%,transparent),radial-gradient(ellipse 18% 8% at 78% 74%,transparent 84%,#ffe2b0 90% 96%,transparent),radial-gradient(ellipse 8% 18% at 78% 74%,transparent 84%,#ffe2b0 90% 96%,transparent);opacity:.72}
.palace-cities{position:absolute;inset-inline:8px;top:73%;text-align:center;color:#fff1d3;font-size:clamp(13px,3.3vw,20px);text-shadow:0 2px 6px #310f23;transition:opacity .35s;pointer-events:none}
.opening .palace-cities{opacity:0}
.countdown-section{background:linear-gradient(125deg,#47264f,#742c42 60%,#651d32)}
.countdown>div{background:linear-gradient(150deg,#864373,#432749)}
.countdown>div:nth-child(2n){background:linear-gradient(150deg,#a64451,#662235)}
@media(prefers-reduced-motion:reduce){.palace-cities{transition:none}}

#cover.courtyard-cover{
  isolation:isolate;overflow:hidden;display:grid;place-items:center;
  background:#291629;color:#fff0cf;perspective:1100px;
  transition:opacity .6s 2s,visibility 0s 2.6s;
}
.courtyard-atmosphere,.courtyard-arch,.courtyard-steps{position:absolute;pointer-events:none}
.courtyard-atmosphere{inset:0;background:
  radial-gradient(ellipse at 50% 80%,#ffc079 0%,#ad514e 22%,transparent 60%),
  linear-gradient(120deg,#321c45,#382642 45%,#551e32);
}
.courtyard-tower{position:absolute;inset-block:0;width:34%;background:
  radial-gradient(circle,#f6bf7f82 0 1px,transparent 2px) 0 0/18px 18px,
  linear-gradient(90deg,#24172d,#613844 74%,#ca835d);
  border-inline:4px double #f3bb7a;box-shadow:inset 0 0 0 13px #492739;
}
.tower-west{left:0;clip-path:polygon(0 0,100% 0,100% 15%,89% 15%,89% 22%,81% 22%,81% 29%,73% 29%,73% 100%,0 100%)}
.tower-east{right:0;transform:scaleX(-1);background:
  repeating-radial-gradient(ellipse at 28% 50%,transparent 0 15px,#ffdab657 16px 17px,transparent 18px 28px),
  linear-gradient(90deg,#31172a,#863540 80%,#de946b);
  clip-path:polygon(0 0,100% 0,100% 16%,91% 16%,91% 22%,82% 22%,82% 29%,73% 29%,73% 100%,0 100%);
}
.courtyard-steps{inset:auto 0 0;height:28%;background:repeating-linear-gradient(to top,#662e3c 0 6px,#d88c6280 7px 9px,#932e45 10px 21px);clip-path:polygon(27% 0,73% 0,100% 100%,0 100%);opacity:.85}
.courtyard-arch{inset:5% 22% 11%;border:9px double #ffd493;border-bottom:0;border-radius:50% 50% 0 0 / 34% 34% 0 0;box-shadow:0 0 0 8px #642d3d,0 0 0 10px #d18a58,0 0 32px #ffbd7580}
.courtyard-leaf{position:absolute;inset-block:7% 11%;width:28%;background:repeating-linear-gradient(35deg,#ffe0ab2a 0 1px,transparent 1px 22px),linear-gradient(90deg,#532840,#8d3949);border:5px double #eead70;box-shadow:inset 0 0 0 10px #451f34,inset 0 0 0 12px #c4815d;transition:transform 1.55s .18s cubic-bezier(.5,0,.2,1),opacity .6s 1.2s}
.leaf-west{left:22%;transform-origin:left;border-radius:100% 0 0 0 / 32% 0 0 0}
.leaf-east{right:22%;transform-origin:right;border-radius:0 100% 0 0 / 0 32% 0 0}
.opening .leaf-west{transform:rotateY(-104deg);opacity:0}
.opening .leaf-east{transform:rotateY(104deg);opacity:0}
.courtyard-lantern{position:absolute;top:29%;width:19px;height:36px;border:3px double #ffdc9b;border-radius:44%;background:#ffdc957a;box-shadow:0 0 27px 9px #ffb85e55;animation:courtyard-glow 2.6s ease-in-out infinite alternate}
.lantern-west{left:15%}.lantern-east{right:15%;animation-delay:-1.15s}
@keyframes courtyard-glow{to{box-shadow:0 0 45px 16px #ffc77b7a;transform:translateY(4px)}}
.courtyard-title{position:relative;z-index:2;width:min(86vw,740px);text-align:center;padding:24px;color:#fff5da;text-shadow:0 3px 16px #321121;transition:opacity .5s,transform .7s}
.courtyard-label{letter-spacing:.23em;font-size:clamp(12px,2vw,19px);margin:0}
.courtyard-names{font:clamp(58px,12vw,138px)/.95 'Great Vibes',cursive;margin:.28em 0 .14em}
html:not([lang=en]) .courtyard-names{font:inherit;font-size:clamp(35px,8vw,90px);line-height:1.25}
.courtyard-cities{margin:0 0 24px;font-size:clamp(16px,3vw,24px)}
#cover .courtyard-open{position:static;transform:none;width:auto;height:auto;padding:12px 22px;border:1px solid #ffe4aa;border-radius:3px;background:#f5d79e;color:#3f2034;font:inherit;font-size:18px;box-shadow:0 5px 22px #32112188}
#cover.opening .courtyard-open{animation:none}
.opening .courtyard-title{opacity:0;transform:translateY(-16px)}
.opening .courtyard-atmosphere{animation:palace-bloom 2.3s ease-out both}
@media(max-width:650px){
  .courtyard-arch{inset-inline:10%}.courtyard-leaf{width:40%}.leaf-west{left:10%}.leaf-east{right:10%}
  .courtyard-tower{width:19%}.lantern-west{left:5%}.lantern-east{right:5%}
}
@media(prefers-reduced-motion:reduce){
  .courtyard-lantern,.opening .courtyard-atmosphere{animation:none}
  .courtyard-title,.courtyard-leaf{transition:none}
}

 const finishReveal=()=> {

 const onDoorArrival=(event)=>{

const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
const entryObserver = new IntersectionObserver(entries => {
  for (const entry of entries) {
    if (!entry.isIntersecting) continue;
    entry.target.classList.add('visible', 'in-view');
    entryObserver.unobserve(entry.target);
  }
}, {threshold: .08});

document.querySelectorAll('.invitation-card, .countdown-section, .scratch-section, .schedule, .venue, .family-section').forEach(section => {
  section.classList.add('scroll-entry');
  entryObserver.observe(section);
});
document.querySelectorAll('.reveal').forEach(section => entryObserver.observe(section));

function setShutter(button, open) {
 button.setAttribute('aria-expanded', String(open));
}
const shutterObserver = new IntersectionObserver((entries, observer) => {
 for (const entry of entries) {
   if (!entry.isIntersecting) continue;
   setShutter(entry.target, true);
   observer.unobserve(entry.target);
 }
}, {threshold:.55});
document.querySelectorAll('.shutter-control').forEach(button => {
 shutterObserver.observe(button);
 button.onclick = () => {
   shutterObserver.unobserve(button);
   setShutter(button, button.getAttribute('aria-expanded') !== 'true');
 };
});
const petalLayer = document.querySelector('.rose-fall');

  for (let i = 0; i < 19; i++) {

      '--left:' + ((i * 37 + 4) % 98) + '%',

      '--opacity:' + (.46 + (i % 5) * .07),
      '--duration:' + (19 + (i * 11) % 15) + 's',
      '--delay:' + -(2 + (i * 13) % 24) + 's'
    ].join(';');
    petalLayer.append(petal);
  }
}

const scratch = document.querySelector('.scratch-date');
const foil = scratch.querySelector('canvas');
const instruction = scratch.querySelector('.scratch-instruction');
const revealButton = scratch.querySelector('button');
const weddingDate = scratch.querySelector('#wedding-date');
const brush = foil.getContext('2d', {willReadFrequently:true});
let scratchPointer = null;
let lastPoint = null;
let foilPainted = false;

function revealWeddingDate(moveFocus = false) {
  foil.hidden = true;
  instruction.hidden = true;
  revealButton.hidden = true;
  weddingDate.removeAttribute('aria-hidden');
  scratch.querySelector('.scratch-confirmation').hidden = false;
  if (moveFocus) weddingDate.focus({preventScroll:true});
}
function paintFoil() {
  if (foil.hidden) return;
  const width = foil.clientWidth;
  const height = foil.clientHeight;
  if (!width || !height || (foilPainted && foil.width === width && foil.height === height)) return;
  const previous = foilPainted ? document.createElement('canvas') : null;
  if (previous) {
    previous.width = foil.width;
    previous.height = foil.height;
    previous.getContext('2d').drawImage(foil, 0, 0);
  }
  foilPainted = true;
  foil.width = width;
  foil.height = height;
  if (previous) {
    brush.drawImage(previous, 0, 0, width, height);
    return;
  }
  const gold = brush.createLinearGradient(0, 0, width, height);
  gold.addColorStop(0, '#b78353');
  gold.addColorStop(.45, '#f3d9a2');
  gold.addColorStop(1, '#b88858');
  brush.fillStyle = gold;
  brush.fillRect(0, 0, width, height);
  brush.fillStyle = '#fff7d972';
  for (let y = 4; y < height; y += 7) {
    for (let x = 5 + (y % 11); x < width; x += 11) brush.fillRect(x, y, 1, 1);
  }
}
function scratchAt(event) {
  const rect = foil.getBoundingClientRect();
  const point = [event.clientX - rect.left, event.clientY - rect.top];
  brush.globalCompositeOperation = 'destination-out';
  brush.lineWidth = 36;
  brush.lineCap = 'round';
  brush.beginPath();
  if (lastPoint) {
    brush.moveTo(...lastPoint);
    brush.lineTo(...point);
    brush.stroke();
  } else {
    brush.arc(...point, 18, 0, Math.PI * 2);
    brush.fill();
  }
  lastPoint = point;
  brush.globalCompositeOperation = 'source-over';
}
function endScratch(event) {
  if (event.pointerId !== scratchPointer) return;
  scratchPointer = null;
  lastPoint = null;
  const pixels = brush.getImageData(0, 0, foil.width, foil.height).data;
  let cleared = 0;
  for (let i = 3; i < pixels.length; i += 40) if (pixels[i] === 0) cleared++;
  if (cleared / Math.ceil(pixels.length / 40) >= .24) revealWeddingDate();
}
revealButton.onclick = () => revealWeddingDate(true);
if (brush) {
  new ResizeObserver(paintFoil).observe(foil);
  paintFoil();
  foil.addEventListener('pointerdown', event => {
    if (event.button !== 0 || scratchPointer !== null) return;
    scratchPointer = event.pointerId;
    foil.setPointerCapture(scratchPointer);
    instruction.hidden = true;
    scratchAt(event);
  });
  foil.addEventListener('pointermove', event => {
    if (event.pointerId === scratchPointer) scratchAt(event);
  });
  foil.addEventListener('lostpointercapture', endScratch);
} else {
  revealWeddingDate();
}

const dayList = document.querySelector('#days');
let processionFrame = 0;

function updateProcession() {
 processionFrame = 0;
 const viewport = window.innerHeight;
 const bounds = dayList.getBoundingClientRect();
 if (bounds.bottom < -viewport || bounds.top > 2 * viewport) return;
 const rows = Array.from(dayList.querySelectorAll('.procession-row'));
 const readingLine = viewport * .52;
 let closest = null;
 let closestDistance = Infinity;
 for (const row of rows) {
   const rect = row.getBoundingClientRect();
   const distance = Math.abs(rect.top + rect.height / 2 - readingLine);
   if (distance < closestDistance) {
     closest = row;
     closestDistance = distance;
   }
   if (rect.top < viewport * .87) row.firstElementChild.classList.add('is-unrolled');
 }
 for (const row of rows) row.classList.toggle('is-current', row === closest);
}
function queueProcession() {
 if (!processionFrame) processionFrame = requestAnimationFrame(updateProcession);
}
window.addEventListener('scroll', queueProcession, {passive:true});
window.addEventListener('resize', queueProcession);
new ResizeObserver(queueProcession).observe(dayList);
new MutationObserver(queueProcession).observe(dayList, {childList:true});
queueProcession();
